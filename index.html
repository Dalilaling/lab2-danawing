<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="author" content="TU NOMBRE Y CÉDULA">

<title>Laboratorio 2 - UTP</title>

<style>

/* Estilos básicos ya listos para que se vea ordenado */

body { font-family: Arial, sans-serif; background: #f3f4f6; padding: 20px; }

.contenedor { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }

.campo { margin-bottom: 12px; }

label { display: block; font-weight: bold; }

input { width: 100%; padding: 8px; box-sizing: border-box; }

table { width: 100%; border-collapse: collapse; margin-top: 15px; }

th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }

</style>

</head>

<body>
    <main class="contenedor">
        <h1>Portal de Registro Académico</h1>
        <!-- Las secciones irán aquí adentro -->
         <!-- Bloque 1: Formulario -->
        <form action="#" method="POST">
            <fieldset>
                <legend>Datos del Estudiante</legend>
                <div class="campo">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                    
                    <!-- Aquí irá el Nombre -->
                </div>


                <div class="campo">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                    <!-- Aquí irá el Correo -->
                </div>
                <div class="campo">
                    <label for="password">contrasena:</label>
                    <input type="password" id="password" name="password" required>
                    
                    <!-- Aquí irá el Nombre -->
                </div>

                <button type="submit">Guardar Registro</button>
                <!-- Los campos irán aquí adentro -->
            </fieldset>
            <!-- El contenido del formulario irá aquí -->
        </form>
        <!-- Bloque 2: Tabla -->
         
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Asignatura</th> 
                     <!-- Celdas de títulos aquí -->
                </tr>

                <!-- Las filas de encabezado irán aquí -->
            </thead>
            
            <tbody>
                <tr>
                    <td>1024</td>
                    <td>Desarrollo Web</td>
                    <!-- Celdas de datos aquí -->
                </tr>
                <!-- Las filas de datos irán aquí -->
            </tbody>
            <!-- El contenido de la tabla irá aquí -->
        
        </table>
    </main>

<!-- AQUÍ ES DONDE EMPIEZAN A ESCRIBIR PASO A PASO -->

</body>

</html>
